<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USD to DZD Converter</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;

        }

        .converter {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 20px;
            margin-bottom: 25px;
            padding: 16px;
            background: #f0fdf4;
            border: 2px solid #22c55e;
            border-radius: 10px;
            font-size: 26px;
            font-weight: bold;
            color: #15803d;
        }


        h3 {
            margin-top: 30px;
            margin-bottom: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #2563eb;
            color: white;
        }

        tbody tr:nth-child(even) {
            background: #f8f8f8;
        }

        tbody tr:hover {
            background: #eef4ff;
        }

        .table-note {
            margin-bottom: 15px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="converter">
        <h2>USD → DZD Converter</h2>

        <label>Amount (USD)</label>
        <input type="number" id="usd" placeholder="Enter USD" step="0.01" min="0">

        <button onclick="convert()">Convert</button>

        <div class="result" id="result">
            0 DZD
        </div>



        <h3>Common USD to DZD Conversions</h3>


        <p class="table-note">
            Using an exchange rate of <strong>1 USD = 250.00 DZD</strong>
        </p>
        <table id="conversionTable">
            <thead>
                <tr>
                    <th>USD</th>
                    <th>DZD</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>


    </div>

    <script>
        // Official exchange rate (example)
        // Change whenever needed.
        const USD_TO_DZD = 250.00;

        const commonAmounts = [
            1,
            2,
            5,
            10,
            20,
            25,
            50,
            75,
            100,
            200,
            250,
            500,
            750,
            1000,
            2500,
            5000,
            10000,
            25000,
            50000,
            100000,
            250000,
            500000,
            1000000
        ];

        function buildTable() {
            const tbody = document.querySelector("#conversionTable tbody");

            tbody.innerHTML = "";

            commonAmounts.forEach(amount => {
                const tr = document.createElement("tr");

                tr.innerHTML = `
            <td>$${amount.toLocaleString()}</td>
            <td>${(amount * USD_TO_DZD).toLocaleString(undefined, {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                })} DZD</td>
        `;

                tbody.appendChild(tr);
            });
        }

        buildTable();

        function convert() {

            const usd = parseFloat(document.getElementById("usd").value);

            if (isNaN(usd)) {
                document.getElementById("result").textContent =
                    "Please enter a valid amount.";
                return;
            }

            const dzd = usd * USD_TO_DZD;

            document.getElementById("result").textContent =
                `${usd.toFixed(2)} USD = ${dzd.toLocaleString()} DZD`;
        }

        // Convert while typing
        document.getElementById("usd").addEventListener("input", convert);
    </script>

</body>

</html>
