name: Bug report
description: Something is broken or looks wrong
labels: [bug]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - Currencies
        - Commodities
        - Crypto
        - Stocks
        - Worker (Yahoo proxy)
        - i18n / translations
        - Install / PWA
        - Other / general
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead? Include steps to reproduce.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where does it happen?
      options:
        - Desktop browser
        - Browser on mobile (not installed)
        - Installed PWA on Android
        - Installed PWA on iOS
        - Multiple / not sure
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: App language
      description: Matters for RTL-related layout bugs.
      options:
        - English
        - Arabic (RTL)
        - Both
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / OS
      placeholder: e.g. Firefox 145 on Windows 11, Chrome on Pixel 8
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots help a lot. Note: finapp is beta — if the issue appeared after an update, try clearing the app's local data first and mention whether that fixed it.
